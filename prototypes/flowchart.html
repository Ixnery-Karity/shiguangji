<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校园二手交易小程序 · 核心业务流程图</title>
<style>
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f6f8;color:#222;padding:30px 16px;margin:0;}
  h1{text-align:center;color:#2E7D32;font-size:25px;margin-bottom:4px;}
  p.sub{text-align:center;color:#888;font-size:14px;margin-bottom:26px;}
  .flow{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);max-width:1080px;margin:0 auto 30px;padding:20px 24px 28px;}
  .flow h2{color:#1b5e20;font-size:18px;margin:0 0 4px;border-left:5px solid #2E7D32;padding-left:10px;}
  .flow .note{color:#888;font-size:12px;margin:0 0 12px;padding-left:15px;}
  svg{width:100%;height:auto;display:block;}
  .legend{max-width:1080px;margin:0 auto;background:#fff;border-radius:12px;padding:16px 24px;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:#555;align-items:center;}
  .legend .k{display:flex;align-items:center;gap:8px;}
  .legend .sw{width:26px;height:16px;border-radius:3px;}
</style>
</head>
<body>
  <h1>校园二手交易小程序 · 核心业务流程图</h1>
  <p class="sub">v0.1.0 · 强认证 / 仅撮合线下当面交易</p>

  <div class="legend">
    <div class="k"><span class="sw" style="background:#2E7D32;"></span>起点 / 终点</div>
    <div class="k"><span class="sw" style="background:#e8f5e9;border:1px solid #2E7D32;"></span>操作 / 页面</div>
    <div class="k"><span class="sw" style="background:#fff3e0;border:1px solid #ff9800;transform:rotate(0);"></span>判断分支</div>
    <div class="k"><span class="sw" style="background:#e3f2fd;border:1px solid #1976d2;"></span>后台 / 系统处理</div>
  </div>
  <div style="height:20px;"></div>

  <!-- 流程1：学生认证 -->
  <div class="flow">
    <h2>流程 ① 学生认证（强认证 · 两级门槛）</h2>
    <p class="note">邮箱验证=准入门槛；学生证/学籍=可信身份。审核通过方可发布与交易。</p>
    <svg viewBox="0 0 1040 300">
      <defs>
        <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 z" fill="#666"/>
        </marker>
      </defs>
      <!-- nodes -->
      <g font-size="13" text-anchor="middle">
        <!-- start -->
        <rect x="20" y="120" rx="20" ry="20" width="120" height="46" fill="#2E7D32"/>
        <text x="80" y="148" fill="#fff">微信授权登录</text>
        <!-- email -->
        <rect x="180" y="120" rx="8" width="140" height="46" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="250" y="141" fill="#1b5e20">绑定校园邮箱</text>
        <text x="250" y="157" fill="#1b5e20" font-size="11">收验证码校验</text>
        <!-- decision email -->
        <polygon points="430,143 480,110 530,143 480,176" fill="#fff3e0" stroke="#ff9800"/>
        <text x="480" y="140" fill="#e65100" font-size="12">邮箱后缀</text>
        <text x="480" y="155" fill="#e65100" font-size="12">是本校?</text>
        <!-- upload cert -->
        <rect x="580" y="120" rx="8" width="150" height="46" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="655" y="141" fill="#1b5e20">上传学生证</text>
        <text x="655" y="157" fill="#1b5e20" font-size="11">OCR识别信息</text>
        <!-- backend review -->
        <rect x="790" y="120" rx="8" width="150" height="46" fill="#e3f2fd" stroke="#1976d2"/>
        <text x="865" y="141" fill="#0d47a1">后台人工审核</text>
        <text x="865" y="157" fill="#0d47a1" font-size="11">+可选学籍核验</text>
        <!-- decision review -->
        <polygon points="865,210 918,180 971,210 918,240" fill="#fff3e0" stroke="#ff9800"/>
        <text x="918" y="214" fill="#e65100" font-size="12">通过?</text>
        <!-- success -->
        <rect x="640" y="252" rx="20" width="160" height="42" fill="#2E7D32"/>
        <text x="720" y="278" fill="#fff">✔ 认证学生（解锁交易）</text>
        <!-- reject -->
        <rect x="470" y="120" width="0" height="0"/>
      </g>
      <!-- edges -->
      <g stroke="#666" stroke-width="1.6" fill="none">
        <line x1="140" y1="143" x2="178" y2="143" marker-end="url(#ar)"/>
        <line x1="320" y1="143" x2="428" y2="143" marker-end="url(#ar)"/>
        <line x1="530" y1="143" x2="578" y2="143" marker-end="url(#ar)"/>
        <line x1="730" y1="143" x2="788" y2="143" marker-end="url(#ar)"/>
        <line x1="865" y1="166" x2="865" y2="178" marker-end="url(#ar)"/>
        <!-- review pass -> success -->
        <path d="M890,232 Q820,268 802,272" marker-end="url(#ar)"/>
        <!-- review fail -> back to upload -->
        <path d="M945,215 Q1000,120 940,110 L865,110 L865,118" marker-end="url(#ar)"/>
      </g>
      <g font-size="11" fill="#e65100">
        <text x="500" y="103">否→驳回</text>
        <text x="835" y="255">通过</text>
        <text x="985" y="150">驳回·重传</text>
      </g>
    </svg>
  </div>

  <!-- 流程2：发布 -->
  <div class="flow">
    <h2>流程 ② 发布闲置商品</h2>
    <p class="note">未认证用户点击发布将被拦截并引导认证；发布经违禁品/敏感词校验后进入信息流。</p>
    <svg viewBox="0 0 1040 170">
      <g font-size="13" text-anchor="middle">
        <rect x="20" y="60" rx="20" width="110" height="46" fill="#2E7D32"/>
        <text x="75" y="88" fill="#fff">点击「发布」</text>
        <polygon points="215,83 265,50 315,83 265,116" fill="#fff3e0" stroke="#ff9800"/>
        <text x="265" y="80" fill="#e65100" font-size="12">已认证?</text>
        <text x="265" y="95" fill="#e65100" font-size="11">学生</text>
        <rect x="215" y="128" rx="8" width="100" height="34" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="265" y="150" fill="#1b5e20" font-size="12">跳认证页</text>
        <rect x="365" y="60" rx="8" width="150" height="46" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="440" y="81" fill="#1b5e20">填写图文/价格</text>
        <text x="440" y="97" fill="#1b5e20" font-size="11">分类·成色·位置</text>
        <rect x="560" y="60" rx="8" width="150" height="46" fill="#e3f2fd" stroke="#1976d2"/>
        <text x="635" y="81" fill="#0d47a1">违禁品/敏感词</text>
        <text x="635" y="97" fill="#0d47a1" font-size="11">系统校验</text>
        <polygon points="760,83 810,50 860,83 810,116" fill="#fff3e0" stroke="#ff9800"/>
        <text x="810" y="87" fill="#e65100" font-size="12">合规?</text>
        <rect x="905" y="60" rx="20" width="120" height="46" fill="#2E7D32"/>
        <text x="965" y="82" fill="#fff" font-size="12">上架成功</text>
        <text x="965" y="98" fill="#fff" font-size="11">进入信息流</text>
      </g>
      <g stroke="#666" stroke-width="1.6" fill="none">
        <line x1="130" y1="83" x2="213" y2="83" marker-end="url(#ar)"/>
        <line x1="315" y1="83" x2="363" y2="83" marker-end="url(#ar)"/>
        <line x1="265" y1="116" x2="265" y2="126" marker-end="url(#ar)"/>
        <line x1="515" y1="83" x2="558" y2="83" marker-end="url(#ar)"/>
        <line x1="710" y1="83" x2="758" y2="83" marker-end="url(#ar)"/>
        <line x1="860" y1="83" x2="903" y2="83" marker-end="url(#ar)"/>
      </g>
      <g font-size="11" fill="#e65100">
        <text x="332" y="76">是</text>
        <text x="238" y="128">否</text>
        <text x="880" y="76">是</text>
      </g>
    </svg>
  </div>

  <!-- 流程3：撮合交易 -->
  <div class="flow">
    <h2>流程 ③ 撮合与线下当面交易（平台不碰货款）</h2>
    <p class="note">买卖双方 IM 沟通 → 约当面 → 发起交易 → 双向确认完成 → 互评。全程留痕用于举报取证。</p>
    <svg viewBox="0 0 1040 250">
      <g font-size="13" text-anchor="middle">
        <rect x="20" y="30" rx="20" width="120" height="44" fill="#2E7D32"/>
        <text x="80" y="57" fill="#fff" font-size="12">买家点「聊一聊」</text>
        <rect x="185" y="30" rx="8" width="130" height="44" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="250" y="50" fill="#1b5e20" font-size="12">IM沟通议价</text>
        <text x="250" y="66" fill="#1b5e20" font-size="11">约时间地点</text>
        <rect x="360" y="30" rx="8" width="140" height="44" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="430" y="50" fill="#1b5e20" font-size="12">一方「发起交易」</text>
        <text x="430" y="66" fill="#1b5e20" font-size="11">生成交易记录</text>
        <rect x="545" y="30" rx="8" width="150" height="44" fill="#e3f2fd" stroke="#1976d2"/>
        <text x="620" y="50" fill="#0d47a1" font-size="12">线下当面交易</text>
        <text x="620" y="66" fill="#0d47a1" font-size="11">一手交钱一手交货</text>
        <polygon points="810,52 865,20 920,52 865,84" fill="#fff3e0" stroke="#ff9800"/>
        <text x="865" y="49" fill="#e65100" font-size="11">双方都点</text>
        <text x="865" y="63" fill="#e65100" font-size="11">已完成?</text>
        <!-- yes -> done -->
        <rect x="760" y="150" rx="20" width="210" height="44" fill="#2E7D32"/>
        <text x="865" y="170" fill="#fff" font-size="12">✔ 交易闭环·商品标记已售</text>
        <text x="865" y="186" fill="#fff" font-size="11">→ 双方互相评价</text>
        <!-- no -> wait -->
        <rect x="545" y="150" rx="8" width="150" height="44" fill="#e8f5e9" stroke="#2E7D32"/>
        <text x="620" y="171" fill="#1b5e20" font-size="12">待对方确认</text>
        <text x="620" y="187" fill="#1b5e20" font-size="11">超时可撤销</text>
      </g>
      <g stroke="#666" stroke-width="1.6" fill="none">
        <line x1="140" y1="52" x2="183" y2="52" marker-end="url(#ar)"/>
        <line x1="315" y1="52" x2="358" y2="52" marker-end="url(#ar)"/>
        <line x1="500" y1="52" x2="543" y2="52" marker-end="url(#ar)"/>
        <line x1="695" y1="52" x2="808" y2="52" marker-end="url(#ar)"/>
        <path d="M865,84 L865,148" marker-end="url(#ar)"/>
        <path d="M812,68 Q700,110 620,148" marker-end="url(#ar)"/>
        <path d="M620,150 Q620,120 660,110" stroke-dasharray="4 3"/>
        <path d="M660,110 L820,80" stroke-dasharray="4 3" marker-end="url(#ar)"/>
      </g>
      <g font-size="11" fill="#e65100">
        <text x="885" y="120">是</text>
        <text x="700" y="100">否</text>
      </g>
      <text x="620" y="225" font-size="11" fill="#888" text-anchor="middle">（待确认方完成后回到判断）</text>
    </svg>
  </div>

  <!-- 流程4：全局页面跳转 -->
  <div class="flow">
    <h2>流程 ④ 全局页面跳转地图</h2>
    <p class="note">小程序主要页面之间的导航关系。</p>
    <svg viewBox="0 0 1040 260">
      <g font-size="12" text-anchor="middle">
        <rect x="440" y="15" rx="8" width="160" height="40" fill="#2E7D32"/><text x="520" y="40" fill="#fff">首页 · 商品瀑布流</text>
        <rect x="120" y="105" rx="8" width="130" height="40" fill="#e8f5e9" stroke="#2E7D32"/><text x="185" y="130" fill="#1b5e20">搜索 / 筛选</text>
        <rect x="300" y="105" rx="8" width="130" height="40" fill="#e8f5e9" stroke="#2E7D32"/><text x="365" y="130" fill="#1b5e20">商品详情</text>
        <rect x="460" y="105" rx="8" width="120" height="40" fill="#e8f5e9" stroke="#2E7D32"/><text x="520" y="130" fill="#1b5e20">发布闲置</text>
        <rect x="610" y="105" rx="8" width="120" height="40" fill="#e8f5e9" stroke="#2E7D32"/><text x="670" y="130" fill="#1b5e20">消息 / 聊天</text>
        <rect x="770" y="105" rx="8" width="140" height="40" fill="#e8f5e9" stroke="#2E7D32"/><text x="840" y="130" fill="#1b5e20">个人中心</text>
        <rect x="300" y="195" rx="8" width="130" height="38" fill="#e3f2fd" stroke="#1976d2"/><text x="365" y="219" fill="#0d47a1">聊天会话·发起交易</text>
        <rect x="460" y="195" rx="8" width="120" height="38" fill="#e3f2fd" stroke="#1976d2"/><text x="520" y="219" fill="#0d47a1">学生认证</text>
        <rect x="610" y="195" rx="8" width="120" height="38" fill="#e3f2fd" stroke="#1976d2"/><text x="670" y="219" fill="#0d47a1">我的交易/发布</text>
        <rect x="770" y="195" rx="8" width="140" height="38" fill="#fff3e0" stroke="#ff9800"/><text x="840" y="219" fill="#e65100">导航路书(二期)</text>
      </g>
      <g stroke="#999" stroke-width="1.4" fill="none">
        <line x1="470" y1="55" x2="200" y2="103" marker-end="url(#ar)"/>
        <line x1="480" y1="55" x2="370" y2="103" marker-end="url(#ar)"/>
        <line x1="520" y1="55" x2="520" y2="103" marker-end="url(#ar)"/>
        <line x1="560" y1="55" x2="665" y2="103" marker-end="url(#ar)"/>
        <line x1="575" y1="55" x2="835" y2="103" marker-end="url(#ar)"/>
        <line x1="185" y1="145" x2="330" y2="105" marker-end="url(#ar)"/>
        <line x1="365" y1="145" x2="365" y2="193" marker-end="url(#ar)"/>
        <line x1="520" y1="145" x2="520" y2="193" marker-end="url(#ar)"/>
        <line x1="670" y1="145" x2="670" y2="193" marker-end="url(#ar)"/>
        <line x1="840" y1="145" x2="840" y2="193" marker-end="url(#ar)"/>
        <path d="M430,120 Q445,120 458,123" marker-end="url(#ar)"/>
      </g>
    </svg>
  </div>

</body>
</html>
